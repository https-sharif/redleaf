{% extends "blog/base.html" %}

{% block title %}Change Role - RedLeaf{% endblock %}

{% block content %}
<h1 style="font-size:1.2rem; font-weight:600;" class="mb-3">Change Role for {{ target_user.username }}</h1>
<div style="background:#fff; border:1px solid #e0e0e0; border-radius:4px; padding:1.5rem; max-width:400px;">
  <form method="post">
    {% csrf_token %}
    <div class="mb-3">
      <label class="form-label fw-semibold" style="font-size:0.9rem;">Role</label>
      {{ form.role }}
    </div>
    <div class="d-flex gap-2">
      <button type="submit" class="btn btn-sm btn-primary">Save</button>
      <a href="{% url 'user_management' %}" class="btn btn-sm btn-outline-secondary">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
