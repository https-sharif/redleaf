{% extends "blog/base.html" %}

{% block title %}Delete User - RedLeaf{% endblock %}

{% block content %}
<h1 style="font-size:1.2rem; font-weight:600;" class="mb-3">Delete User</h1>
<p>Are you sure you want to delete user <strong>{{ target_user.username }}</strong>? All their posts and comments will also be deleted.</p>
<form method="post" class="d-flex gap-2">
  {% csrf_token %}
  <button type="submit" class="btn btn-sm btn-danger">Yes, delete</button>
  <a href="{% url 'user_management' %}" class="btn btn-sm btn-outline-secondary">Cancel</a>
</form>
{% endblock %}
