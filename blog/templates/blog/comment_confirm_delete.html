{% extends "blog/base.html" %}

{% block title %}Delete Comment - RedLeaf{% endblock %}

{% block content %}
<h1 style="font-size:1.2rem; font-weight:600;" class="mb-3">Delete Comment</h1>
<p>Are you sure you want to delete this comment by <strong>{{ comment.author.username }}</strong>?</p>
<blockquote class="blockquote" style="font-size:0.95rem; border-left:3px solid #ddd; padding-left:1rem; color:#555;">
  {{ comment.body }}
</blockquote>
<form method="post" class="d-flex gap-2">
  {% csrf_token %}
  <button type="submit" class="btn btn-sm btn-danger">Yes, delete</button>
  <a href="{% url 'post_detail' comment.post.pk %}" class="btn btn-sm btn-outline-secondary">Cancel</a>
</form>
{% endblock %}
